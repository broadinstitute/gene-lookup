name: Generate Combined Gene Table

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-gene-table:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Java 11
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Restore annotation data cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.annotations
        key: annotations-cache-${{ github.run_id }}
        restore-keys: |
          annotations-cache-

    - name: Restore LLM response cache
      uses: actions/cache/restore@v6
      with:
        path: .cache/llm_response_cache.db
        key: llm-cache-${{ github.run_id }}
        restore-keys: |
          llm-cache-

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Install GCS connector for Hail
      run: |
        # Download GCS connector into Spark's jars directory so Hail picks it up automatically
        SPARK_HOME=$(python3 -c "import pyspark; print(pyspark.__path__[0])")
        curl -sL "https://storage.googleapis.com/hadoop-lib/gcs/gcs-connector-hadoop3-latest.jar" \
          -o "$SPARK_HOME/jars/gcs-connector-hadoop3-latest.jar"

        # Configure Hadoop to use the GCS connector with application default credentials
        mkdir -p /tmp/hadoop-conf
        cat > /tmp/hadoop-conf/core-site.xml << 'EOF'
        <?xml version="1.0"?>
        <configuration>
          <property>
            <name>fs.gs.impl</name>
            <value>com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem</value>
          </property>
          <property>
            <name>fs.AbstractFileSystem.gs.impl</name>
            <value>com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS</value>
          </property>
          <property>
            <name>google.cloud.auth.type</name>
            <value>APPLICATION_DEFAULT</value>
          </property>
        </configuration>
        EOF

    - name: Generate combined gene table
      env:
        OMIM_KEY: ${{ secrets.OMIM_KEY }}
        DBNSFP_KEY: ${{ secrets.DBNSFP_KEY }}
        HADOOP_CONF_DIR: /tmp/hadoop-conf
      run: |
        python3 annotation_utils/generate_combined_gene_table.py

    - name: Add phenotype summary using AI
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        LLM_RESPONSE_CACHE_DB_PATH: ${{ github.workspace }}/.cache/llm_response_cache.db
      run: |
        python3 annotation_utils/add_phenotype_summary_using_AI.py combined_mendelian_gene_disease_table.tsv.gz

    - name: Upload to BigQuery
      run: |
        python3 annotation_utils/load_bigquery.py combined_mendelian_gene_disease_table_with_phenotype_summary.tsv.gz

    - name: Update website with new date and regenerate HTML
      run: |
        # Per-source version/date labels come from ~/.annotations, where each source records them only
        # after a successful download. A source that fell back to its stale cached table (OMIM and dbNSFP
        # do this when their download key expires) therefore keeps the label describing that cached data.
        python3 - << 'EOF'
        import json
        import os
        from annotation_utils.cache_utils import read_source_versions, utc_today

        with open("website/data_last_updated_date.json", "wt") as f:
            json.dump({"data_last_updated_date": utc_today()}, f, indent=2)

        # Merge into the committed labels rather than replacing them. A run where every source served its
        # still-fresh cached table records nothing new, so a wholesale overwrite would publish an empty file
        # and strip every heading's label.
        source_versions_path = "website/source_versions.json"
        source_versions = json.load(open(source_versions_path)) if os.path.isfile(source_versions_path) else {}
        source_versions.update(read_source_versions())
        with open(source_versions_path, "wt") as f:
            json.dump(source_versions, f, indent=2, sort_keys=True)
        EOF
        pip install jinja2
        cd website && python3 generate_website.py

    - name: Commit and push updated website
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add website/data_last_updated_date.json website/source_versions.json index.html gene.html
        git diff --cached --quiet && exit 0
        git commit -m "Update website date to $(date -u +%Y-%m-%d)"
        # Retry pull --rebase + push to handle the race where another commit lands
        # on main between our pull and push.
        for attempt in 1 2 3 4 5; do
          git pull --rebase origin main && git push origin HEAD:main && exit 0
          echo "Push attempt $attempt failed; sleeping then retrying..."
          sleep $((attempt * 5))
        done
        echo "Failed to push after 5 attempts" >&2
        exit 1

    - name: Upload generated files as artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: gene-table-outputs
        path: |
          combined_mendelian_gene_disease_table_with_phenotype_summary.tsv.gz
        retention-days: 30

    - name: Save annotation data cache
      uses: actions/cache/save@v6
      if: success()
      with:
        path: ~/.annotations
        key: annotations-cache-${{ github.run_id }}

    - name: Save LLM response cache
      uses: actions/cache/save@v6
      if: success()
      with:
        path: .cache/llm_response_cache.db
        key: llm-cache-${{ github.run_id }}
